
# ==========================================
# NEXORA - PRODUCTION CONFIGURATION
# Activate with SPRING_PROFILES_ACTIVE=prod
# Never put real credentials in this file.
# ==========================================

spring.application.name=nexora-backend

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# ==========================================
# MySQL Database
# ==========================================
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database schema
# Apply required migrations before deploying with validate.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# ==========================================
# Security / JWT
# ==========================================
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# ==========================================
# CORS
# ==========================================
nexora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:https://nexora-frontend-sable.vercel.app}

# ==========================================
# NEXORA Email - Brevo HTTPS API
# ==========================================
nexora.mail.from=${MAIL_FROM}
nexora.mail.sender-name=NEXORA
nexora.mail.brevo-api-key=${BREVO_API_KEY}
nexora.verification.expiry-minutes=30

# Public frontend URL used in verification/reset links
nexora.frontend-url=${FRONTEND_URL:https://nexora-frontend-sable.vercel.app}

# ==========================================
# AI Assistant - Optional
# ==========================================
nexora.ai.enabled=${NEXORA_AI_ENABLED:false}
nexora.ai.api-key=${NEXORA_AI_API_KEY:}
nexora.ai.base-url=${NEXORA_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
nexora.ai.model=${NEXORA_AI_MODEL:gemini-2.5-flash}

# ==========================================
# Redis - Authentication Rate Limiting
# ==========================================
spring.data.redis.host=${SPRING_DATA_REDIS_HOST}
spring.data.redis.port=${SPRING_DATA_REDIS_PORT:6379}
spring.data.redis.password=${SPRING_DATA_REDIS_PASSWORD}
spring.data.redis.ssl.enabled=${SPRING_DATA_REDIS_SSL_ENABLED:true}
