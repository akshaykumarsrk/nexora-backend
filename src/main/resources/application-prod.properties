# ==========================================
# NEXORA - PRODUCTION CONFIGURATION
# Activate with SPRING_PROFILES_ACTIVE=prod
# Never put real credentials in this file.
# ==========================================

spring.application.name=nexora-backend

# Server
server.port=${PORT:${SERVER_PORT:8080}}

# MySQL - production credentials must be supplied
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Database schema
# Apply all required migrations before deploying with validate.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Security
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS - replace with your actual Vercel URL in Render
nexora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}

# Email configuration
spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

nexora.mail.from=${MAIL_FROM:}
nexora.mail.sender-name=NEXORA
nexora.verification.expiry-minutes=30

# Public frontend URL
nexora.frontend-url=${FRONTEND_URL}

# AI assistant - optional
nexora.ai.enabled=${NEXORA_AI_ENABLED:false}
nexora.ai.api-key=${NEXORA_AI_API_KEY:}
nexora.ai.base-url=${NEXORA_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
nexora.ai.model=${NEXORA_AI_MODEL:gemini-2.5-flash}