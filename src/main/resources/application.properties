spring.application.name=nexora-backend

server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/nexora}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# Keep update for existing local development only. Use validate + versioned migrations in production.
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

# Supply a strong, private key via JWT_SECRET (at least 32 bytes for HS256).
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS
nexora.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}

# ==============================
# NEXORA Email Configuration
# ==============================

spring.mail.host=${MAIL_HOST:smtp-relay.brevo.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# Sender details
nexora.mail.from=${MAIL_FROM}
nexora.mail.sender-name=NEXORA

# Email verification
nexora.verification.expiry-minutes=30

# Public frontend URL used in verification links
nexora.frontend-url=${FRONTEND_URL:http://localhost:4200}

# Optional NEXORA AI assistant (OpenAI-compatible Chat Completions API)
nexora.ai.enabled=${NEXORA_AI_ENABLED:false}
nexora.ai.api-key=${NEXORA_AI_API_KEY:}
nexora.ai.base-url=${NEXORA_AI_BASE_URL:https://generativelanguage.googleapis.com/v1beta}
nexora.ai.model=${NEXORA_AI_MODEL:gemini-2.5-flash}
